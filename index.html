    <script>
      (function() {
        try {
          var saved = localStorage.getItem('smit_billing_theme');
          var isDark = true;
          if (saved === 'dark') {
            isDark = true;
          } else if (saved === 'light') {
            isDark = false;
          } else {
            // 'system' or not set: detect system preference
            isDark = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)').matches : true;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var meta = document.getElementById('theme-color-meta');
          if (meta) {
            meta.setAttribute('content', isDark ? '#020617' : '#f8fafc');
          }
        } catch (e) {}
      })();
    </script>

    <script>
      // Ссылка со стороны (документация, блог, реклама) может привести сразу к нужной
      // вкладке виджета: ?open=book — запись, ?open=case — бизнес-кейс, ?open=chat —
      // разговор, ?ask=... — открыть разговор и сразу задать вопрос.
      (function () {
        var qs = new URLSearchParams(location.search);
        var want = qs.get('open');
        var ask = (qs.get('ask') || '').trim().slice(0, 300);
        if (ask && !want) want = 'chat';
        if (want !== 'book' && want !== 'chat' && want !== 'case') return;
        function open() {
          var W = window.SmitWidget;
          if (!W || !W.open) return false;
          if (ask && W.ask) W.ask(ask); else W.open(want);
          return true;
        }
        document.addEventListener('smit-widget-ready', open, { once: true });
        var timer = setInterval(function () { if (open()) clearInterval(timer); }, 200);
        setTimeout(function () { clearInterval(timer); }, 10000);
      })();

      // Цели Метрики: виджет живёт в теневом DOM, счётчик его кликов не видит.
      (function () {
        function goal(name, params) {
          if (typeof window.ymGoal === 'function') window.ymGoal(name, params || {});
        }
        document.addEventListener('smit-widget-open', function (e) {
          goal('widget_open', { tab: (e.detail && e.detail.tab) || 'chat' });
        });
        document.addEventListener('smit-widget-ask', function () { goal('widget_ask'); });
        document.addEventListener('smit-widget-lead', function (e) {
          goal('lead_sent', { contact: (e.detail && e.detail.contact_type) || '' });
        });
        document.addEventListener('smit-widget-case', function (e) {
          goal('business_case', { subscribers: (e.detail && e.detail.subscribers) || 0 });
        });
        document.addEventListener('smit-widget-case-pdf', function () { goal('business_case_pdf'); });
      })();
    </script>
